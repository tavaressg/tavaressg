# CI — roda a cada push/PR: sintaxe (node --check) + selfTest real (Chrome headless).
# selfTest = os mesmos 160 asserts do ?test=1 manual (CLAUDE.md · "Como rodar"),
# executados no Chrome pré-instalado do runner via .github/ci/selftest.mjs.
name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe (node --check)
        run: |
          node --check app.js
          node --check supabase.js
          node --check sw.js

      - name: selfTest headless (?test=1 no Chrome do runner)
        run: |
          python3 -m http.server 5179 &
          npm install --no-fund --no-audit puppeteer-core@23
          node .github/ci/selftest.mjs

      # Guards de allowlist do morphdom + contratos em jsdom. Leem o app.js de
      # verdade: uma tela habilitada em _TELAS_MORPH/_FIN_MORPH sem estar
      # delegation-pura e sincrona derruba o job. Ate aqui rodavam so' na maquina
      # do dev — dependiam de alguem lembrar de `npm test` antes de publicar.
      - name: Guards do morphdom (npm test)
        run: |
          npm install --no-fund --no-audit jsdom@25
          npm test
